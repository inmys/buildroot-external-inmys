<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>INMYS Cog</title>
<style>body{background:#18232f;color:white;font:28px sans-serif;margin:3em}canvas{border:1px solid #9ac}a{color:#9df}</style>
<h1>Weston + WPE WebKit / Cog</h1>
<p id="status">Проверка WebGL…</p><canvas width="640" height="240"></canvas>
<p>Для открытия сайта: <code>inmys-browser https://example.org</code></p>
<script>
const canvas=document.querySelector('canvas'), gl=canvas.getContext('webgl');
if(gl){
 const info=gl.getExtension('WEBGL_debug_renderer_info');
 document.querySelector('#status').textContent='WebGL: '+gl.getParameter(gl.VERSION)+' / '+(info?gl.getParameter(info.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER));
 function frame(t){gl.clearColor(.1,.3+.2*Math.sin(t/800),.55,1);gl.clear(gl.COLOR_BUFFER_BIT);requestAnimationFrame(frame)}
 requestAnimationFrame(frame);
}else document.querySelector('#status').textContent='WebGL недоступен';
</script></html>
