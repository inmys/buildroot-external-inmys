# SD: ROM capsule below 3 MiB, redundant environment at 3/3.0625 MiB.
# p1: slot A; p2: reserved slot B; p3: data, initialized on first boot.
# Only sdboot and A have payloads. MBR describes B/data beyond the image EOF.

image sdcard.img {
    hdimage { fill = false }
    # SD_BOOT_BEGIN
    partition sdboot {
        in-partition-table = "no"
        image = "sd-boot/nms-sm-k1892vm21ya.sbimg"
        offset = 512
    }
    # SD_BOOT_END
    partition p1 {
        offset = 4M
        partition-type = 0x83
        image = "rootfs.ext4"
        size = 512M
    }
    partition p2 {
        partition-type = 0x83
        size = 512M
    }
    partition p3 {
        partition-type = 0x83
        size = 96M
    }
}
