# SD card image for NMS-SM-K1892VM21YA
#
#   p1  FAT32  64 MiB   kernel + device tree + extlinux.conf
#   p2  ext4   rest     root filesystem

image boot.vfat {
	vfat {
		files = {
			"Image",
			"nms-*.dtb",
			"extlinux"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition p1 {
		partition-type = 0xc
		bootable = "true"
		image = "boot.vfat"
	}

	partition p2 {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 0
	}
}
