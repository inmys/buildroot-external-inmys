# SD card image for NMS-SM-K1892VM21YA
#
#   p1  FAT32  96 MiB   boot: per-slot kernel + device tree + extlinux.conf
#   p2  ext4  512 MiB   root filesystem, slot A
#   p3  ext4  512 MiB   root filesystem, slot B
#
# A/B is driven entirely from extlinux.conf on p1.  U-Boot is stock
# distro-boot (CONFIG_DISTRO_DEFAULTS, no bootcount, no altbootcmd): it
# reads extlinux.conf and obeys "default".  Switching slots therefore
# needs nothing but rewriting that one file, which is what SWUpdate does
# after it has written the inactive rootfs.

image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"Image.A",
			"Image.B",
			"nms-*.dtb",
			"extlinux"
		}
	}
	size = 96M
}

image sdcard.img {
	hdimage {
	}

	partition p1 {
		partition-type = 0xc
		bootable = "true"
		image = "boot.vfat"
	}

	partition p2 {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 512M
	}

	partition p3 {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 512M
	}
}
