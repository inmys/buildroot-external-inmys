# Intel WiFi in the M.2 slot.  Loaded from S11modules rather than built in:
# the driver needs its firmware from the rootfs, and a built-in iwlwifi
# probes before the rootfs is mounted (see the kernel fragment).
#
# iwlmvm is the module that registers the PCI driver; it pulls in iwlwifi,
# mac80211 and cfg80211 through modules.dep.
iwlmvm
