# SBL build configuration for INMYS NMS-SM-K1892VM21YA V1.
#
# Every entry maps a ddrinit configuration (ddrinit-<name> directory in
# BINARIES_DIR) to the U-Boot device tree which is loaded by SBL-XIP.
# The DTB name must match the U-Boot DTS file name without extension.

[[configs]]
ddrinit_defconfig = "nms-sm-k1892vm21ya"
uboot_dtb = "mcom03r-nms-sm-evm"
boot_types = ["xip", "bootrom"]

[[configs]]
ddrinit_defconfig = "nms-sm-k1892vm21ya"
uboot_dtb = "mcom03r-nms-smarc-tester"
boot_types = ["xip", "bootrom"]

[[configs]]
ddrinit_defconfig = "nms-sm-k1892vm21ya"
uboot_dtb = "mcom03r-nms-itx-sm-lc-v4"
boot_types = ["xip", "bootrom"]

[[configs]]
ddrinit_defconfig = "nms-sm-k1892vm21ya"
uboot_dtb = "mcom03r-nms-sm-elvsmarccb"
boot_types = ["xip", "bootrom"]
