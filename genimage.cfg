image boot.vfat {
	vfat {
		files = {
			"MLO",
			"u-boot.img",
			"zImage",
			"am335x-var-custom.dtb",
			"rootfs.cpio.uboot",
			"boot.scr",
			"rootfs.ubi",
			"install-nand.sh",
			"nand-SHA256SUMS",
		}
	}
	size = 128M
}

image sdcard.img {
	hdimage {
		disk-signature = 0x33580001
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}
	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
